name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run security audit
        run: pnpm audit --audit-level=moderate

      - name: Run codegen
        run: pnpm codegen

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check formatting and linting
        run: pnpm lint:check

      # - name: Run tests
      #   run: pnpm test
