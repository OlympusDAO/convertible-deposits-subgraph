name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Setup project
        uses: ./.github/actions/bootstrap

      - name: Run codegen
        run: pnpm codegen

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check formatting and linting
        run: pnpm lint:check

      # - name: Run tests
      #   run: pnpm test
