name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Bootstrap
        uses: ./.github/actions/bootstrap

      - name: Run codegen
        run: pnpm codegen

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check formatting and linting
        run: pnpm lint:check

      # - name: Run tests
      #   run: pnpm test
